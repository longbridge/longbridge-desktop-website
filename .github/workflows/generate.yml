# All workflows run on the organization's self-hosted Linux runners. To switch, set the repository variable
# LINUX_RUNNER to a JSON runs-on value, e.g. '["self-hosted","Linux","X64"]' (default) or '"ubuntu-latest"'.
name: Generate Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the release (e.g.: v0.1.30)"
        required: true
        default: ""
        type: string

permissions:
  contents: write

jobs:
  run:
    name: Generate
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","Linux","X64"]') }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          REPO: ${{ secrets.REPO }}
          TAG: ${{ inputs.version }}
        run: |
          bun script/release-notes.ts

      - name: Setup Git
        run: |
          git config user.name "Floyd Wang"
          git config user.email "codelife721@gmail.com"

      - name: Create PR
        run: |
          BRANCH_NAME=update-pages-$(date +'%Y%m%d%H%M%S')
          git checkout -b $BRANCH_NAME
          git status
          git add . -A
          git commit -m "Update docs ${{ inputs.version }}"
          git push origin $BRANCH_NAME

          # Create Pull Request
          curl -X POST -H "Authorization: token ${{ secrets.TOKEN }}" -d '{"title":"Update Release Notes ${{ inputs.version }}","head":"'$BRANCH_NAME'","base":"main"}' https://api.github.com/repos/${{ github.repository }}/pulls

      - name: Merge PR
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.TOKEN }}" -d '{"commit_title":"Merge","commit_message":"Merge PR","sha":"$SHA","merge_method":"squash"}' https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/merge
